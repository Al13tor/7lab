<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Космический шутер - Сбор медалей</title>
    <link rel="stylesheet" href="StyleIGRA.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="game-container">
    <div class="ui-panel">
        <div id="scoreDisplay">Медали: 0</div>
        <div id="levelDisplay">Уровень: 1</div>
    </div>
    
    <canvas id="gameCanvas" width="600" height="500"></canvas>
    
    <div id="gameOverScreen" class="hidden">
        <h2>Игра окончена!</h2>
        <p>Вы собрали <span id="finalScore">0</span> медалей.</p>
        <button onclick="restartGame()">Играть снова</button>
    </div>
</div>

<script src="JSIGRA.js"></script>
</body>
</html>
